# Local run: `docker compose up --build`. Checks: `make check` (services in profile "check").
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/gym.db
      # The development bot's token from .env; without it a fixed non-secret token for dev links
      # (scripts/dev-login-link.mjs). The server refuses to start with an empty token.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-local-dev-token}
    volumes:
      # Games survive `docker compose down`; `down -v` deletes them.
      - gym-data:/app/data

  # HTTPS for the development bot: `docker compose --profile tunnel up --build` (docs/telegram-dev.md).
  # `:-` keeps every other compose command working without .env; the tunnel itself then fails to start.
  tunnel:
    profiles: [tunnel]
    image: ngrok/ngrok:3.39.11-alpine
    depends_on: [app]
    # --log stdout: without a terminal ngrok logs nothing, so connection errors would stay invisible.
    command: http --url=${NGROK_URL:-} --log stdout app:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      # ngrok's request inspector, on this machine only.
      - "127.0.0.1:4040:4040"

  backend-check:
    profiles: [check]
    build:
      context: .
      target: backend-deps
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/backend
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app/backend

  frontend-check:
    profiles: [check]
    build:
      context: .
      target: frontend-deps
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/frontend
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app/frontend

volumes:
  gym-data:
